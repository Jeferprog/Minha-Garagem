# Publica o site automaticamente no GitHub Pages toda vez que
# algo novo chega na branch "main".
#
# Para funcionar, ative o GitHub Pages uma única vez:
# Repositório > Settings > Pages > Build and deployment > Source: "GitHub Actions".
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # permite publicar manualmente pelo botão "Run workflow"

permissions:
  contents: read
  pages: write
  id-token: write

# Garante que apenas uma publicação aconteça por vez.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Gerar o site
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar o Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Gerar os arquivos do site
        run: npm run build

      - name: Enviar o resultado para o Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Publicar
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
